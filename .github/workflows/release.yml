name: Build and Release NodeTerm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar como Release en GitHub (por defecto solo compila y firma)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: 'nodeterm'
      SIGNPATH_SIGNING_POLICY_SLUG: 'test-signing'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux packaging tools (bsdtar, rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Webpack
        run: npm run build

      - name: Cleanup native dependencies
        run: npm run rm-cpu-features

      - name: Extract Release Notes from CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : '';
            let notes = '';
            if (fs.existsSync('CHANGELOG.md')) {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const escapedVersion = version.replace(/\./g, '\\.');
              const regex = new RegExp('## \\\\[' + escapedVersion + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)', 'g');
              const match = regex.exec(changelog);
              if (match && match[1]) notes = match[1].trim();
            }
            fs.writeFileSync('RELEASE_NOTES_BODY.md', notes || '### Novedades en esta versión\n- Mejoras generales y correcciones de estabilidad.');
          "

      - name: Create or Update GitHub Release with Changelog & Commit Summary
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES_BODY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux & macOS: Direct build and publish
      - name: Build and Publish Electron Package (Linux / macOS)
        if: matrix.os != 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron Package (Linux / macOS - Test Run)
        if: matrix.os != 'windows-latest' && !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true
        run: npx electron-builder --publish never

      # Windows: Build unsigned packages first
      - name: Build Windows Package
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows: Upload unsigned binaries to Actions artifact
      - name: Upload Windows Executables for Signing
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-win
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binaries
          path: dist/*.exe
          if-no-files-found: error

      # Windows: Submit signing request to SignPath
      - name: Submit Signing Request to SignPath
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-win'

      # Windows: Overwrite dist with signed binaries and update hashes in latest.yml
      - name: Replace Dist with Signed Windows Binaries & Update Hashes
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Get-ChildItem -Path "./signed-win" -Filter "*.exe" -Recurse | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "./dist/$($_.Name)" -Force
            Write-Host "Replaced ./dist/$($_.Name) with signed binary from $($_.FullName)"
          }
          node scripts/update-signed-hashes.js

      # Windows: Upload signed test artifacts (for manual testing via workflow_dispatch)
      - name: Upload Signed Windows Artifacts (Test Run)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-binaries-test
          path: |
            dist/*.exe
            dist/latest.yml

      # Windows: Publish release assets (when running on a tag or release requested)
      - name: Publish Windows Release Assets
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
