name: Build and Release NodeTerm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar como Release en GitHub (por defecto solo compila y firma)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux packaging tools (bsdtar, rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Webpack
        run: npm run build

      - name: Cleanup native dependencies
        run: npm run rm-cpu-features

      - name: Extract Release Notes from CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : '';
            let notes = '';
            if (fs.existsSync('CHANGELOG.md')) {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const escapedVersion = version.replace(/\./g, '\\.');
              const regex = new RegExp('## \\\\[' + escapedVersion + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)', 'g');
              const match = regex.exec(changelog);
              if (match && match[1]) notes = match[1].trim();
            }
            fs.writeFileSync('RELEASE_NOTES_BODY.md', notes || '### Novedades en esta versión\n- Mejoras generales y correcciones de estabilidad.');
          "

      - name: Create or Update GitHub Release with Changelog & Commit Summary
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES_BODY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux & macOS: Direct build and publish
      - name: Build and Publish Electron Package (Linux / macOS)
        if: matrix.os != 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron Package (Linux / macOS - Test Run)
        if: matrix.os != 'windows-latest' && !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true
        run: npx electron-builder --publish never

      # Windows: Build unsigned packages first
      - name: Build Windows Package
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows: Sign executables directly via SignPath PowerShell module
      - name: Sign Windows Binaries via SignPath
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force -Scope CurrentUser

          $projectSlug = "nodeterm"
          $policySlug = "Test_Signing"

          $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe"
          foreach ($file in $exeFiles) {
            Write-Host "Submitting $($file.FullName) to SignPath for signing with policy '$policySlug'..."
            Submit-SigningRequest `
              -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
              -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
              -ProjectSlug $projectSlug `
              -SigningPolicySlug $policySlug `
              -InputArtifactPath $file.FullName `
              -OutputArtifactPath $file.FullName `
              -WaitForCompletion `
              -Force
            Write-Host "Successfully signed $($file.Name)"
          }

          node scripts/update-signed-hashes.js

      # Windows: Upload signed test artifacts (for manual testing via workflow_dispatch)
      - name: Upload Signed Windows Artifacts (Test Run)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-binaries-test
          path: |
            dist/*.exe
            dist/latest.yml

      # Windows: Publish release assets (when running on a tag or release requested)
      - name: Publish Windows Release Assets
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
