name: Build and Release NodeTerm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar como Release en GitHub (por defecto solo compila)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux packaging tools (bsdtar, rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm zsync

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify IronRDP WASM vendor
        run: node scripts/measure-ironrdp-egfx.js --vendor-only

      - name: Build Webpack
        run: npm run build

      - name: Run Tests (Unit, RDP & VNC)
        run: |
          npm run test:unit
          npm run test:rdp
          npm run test:vnc

      - name: Cleanup native dependencies
        run: npm run rm-cpu-features

      - name: Extract Release Notes from CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : '';
            let notes = '';
            if (fs.existsSync('CHANGELOG.md')) {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const escapedVersion = version.replace(/\./g, '\\.');
              const regex = new RegExp('## \\\\[' + escapedVersion + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)', 'g');
              const match = regex.exec(changelog);
              if (match && match[1]) notes = match[1].trim();
            }
            fs.writeFileSync('RELEASE_NOTES_BODY.md', notes || '### Novedades en esta versión\n- Mejoras generales y correcciones de estabilidad.');
          "

      - name: Create or Update GitHub Release with Changelog & Commit Summary
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES_BODY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build and Publish across all platforms (Linux, macOS, Windows)
      - name: Build and Publish Electron Package
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build without publishing for test runs (workflow_dispatch without publish_release)
      - name: Build Electron Package (Test Run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true }}
        run: npx electron-builder --publish never

      # electron-builder no embebe gh-releases-zsync. Se reempaqueta con appimagetool
      # (runtime estatico) y se corrige el sha512 de latest-linux.yml.
      - name: Embed AppImage update information
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          command -v zsyncmake
          shopt -s nullglob
          apps=(dist/*.AppImage)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Se esperaba un AppImage en dist/, encontrados: ${#apps[@]}"
            printf '%s\n' "${apps[@]:-}"
            exit 1
          fi
          APP="${apps[0]}"
          BASE="$(basename "$APP")"
          TOOL_DIR="${RUNNER_TEMP}/appimagetool"
          mkdir -p "$TOOL_DIR"
          TOOL="$TOOL_DIR/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$TOOL" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$TOOL"
          WORK="$(mktemp -d)"
          cleanup() { rm -rf "$WORK"; }
          trap cleanup EXIT
          cp "$APP" "$WORK/in.AppImage"
          chmod +x "$WORK/in.AppImage"
          (cd "$WORK" && ./in.AppImage --appimage-extract)
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          UPDATE_URL="gh-releases-zsync|kalidus|NodeTerm|latest|NodeTerm-*.AppImage.zsync"
          # Empaquetar desde WORK: appimagetool continuous a veces deja el .zsync en CWD.
          (cd "$WORK" && "$TOOL" -n -u "$UPDATE_URL" squashfs-root "$BASE")
          ZSYNC_SRC=""
          for candidate in "$WORK/${BASE}.zsync" "${PWD}/${BASE}.zsync" "./${BASE}.zsync"; do
            if [ -f "$candidate" ]; then
              ZSYNC_SRC="$candidate"
              break
            fi
          done
          if [ -z "$ZSYNC_SRC" ]; then
            mapfile -t found < <(find "$WORK" "$PWD" -maxdepth 2 -type f -name '*.zsync' 2>/dev/null || true)
            if [ "${#found[@]}" -ge 1 ]; then
              ZSYNC_SRC="${found[0]}"
            fi
          fi
          # Fallback: generar zsync a mano si appimagetool solo embutio update info.
          if [ -z "$ZSYNC_SRC" ] || [ ! -f "$ZSYNC_SRC" ]; then
            echo "appimagetool no dejo .zsync; generando con zsyncmake..."
            (cd "$WORK" && zsyncmake -u "$UPDATE_URL" "$BASE")
            if [ -f "$WORK/${BASE}.zsync" ]; then
              ZSYNC_SRC="$WORK/${BASE}.zsync"
            fi
          fi
          if [ -z "$ZSYNC_SRC" ] || [ ! -f "$ZSYNC_SRC" ]; then
            echo "No se pudo obtener el fichero zsync"
            find "$WORK" "$PWD" -maxdepth 3 -name '*.zsync' -print || true
            ls -la "$WORK" || true
            exit 1
          fi
          mv -f "$WORK/$BASE" "$APP"
          mv -f "$ZSYNC_SRC" "dist/${BASE}.zsync"
          chmod +x "$APP"
          rm -f dist/*.AppImage.blockmap
          node scripts/update-appimage-latest-yml.js "$APP" dist/latest-linux.yml
          # No ejecutar el AppImage en CI: el runtime type2 continuous a menudo
          # ignora --appimage-updateinformation sin DISPLAY y arranca Electron.
          if ! grep -aFq 'gh-releases-zsync|kalidus|NodeTerm|latest|' "$APP"; then
            echo "La informacion de actualizacion no quedo embebida en el AppImage"
            exit 1
          fi
          if [ ! -f "dist/${BASE}.zsync" ]; then
            echo "Falta dist/${BASE}.zsync"
            exit 1
          fi
          echo "Update info embebida y zsync listo: dist/${BASE}.zsync"

      - name: Publish AppImage update metadata
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          apps=(dist/*.AppImage)
          if [ "${#apps[@]}" -ne 1 ] || [ ! -f "${apps[0]}.zsync" ] || [ ! -f dist/latest-linux.yml ]; then
            echo "Faltan el AppImage reempaquetado, su .zsync o latest-linux.yml"
            exit 1
          fi
          APP="${apps[0]}"
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name | endswith(".AppImage.blockmap")) | .id')"
          if [ -n "$ids" ]; then
            for id in $ids; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            done
          fi
          gh release upload "$TAG" "$APP" "${APP}.zsync" dist/latest-linux.yml --clobber

      - name: Upload Test Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true }}
        uses: actions/upload-artifact@v4
        with:
          name: nodeterm-artifacts-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
