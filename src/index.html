<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>NodeTerm</title>
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: nodeterm-library:; media-src 'self' blob: data: nodeterm-library:; connect-src 'self' ws: wss: http: https: blob: data: nodeterm-library:; worker-src 'self' blob:; frame-src 'self' nodeterm-library:; object-src 'none'; base-uri 'self';" />
    
    <script>
      // Global polyfill - DEBE ejecutarse ANTES que cualquier otro script
      (function() {
        if (typeof global === 'undefined') {
          if (typeof globalThis !== 'undefined') {
            window.global = globalThis;
          } else if (typeof window !== 'undefined') {
            window.global = window;
          } else if (typeof self !== 'undefined') {
            self.global = self;
          } else {
            this.global = this;
          }
        }
        
        // También asegurar que global esté disponible globalmente
        if (typeof window !== 'undefined' && !window.global) {
          window.global = window;
        }
        
        // Polyfill cargado silenciosamente
      })();
    </script>
    <script>
      // Estilo de boot-splash (mismo catálogo que unlock/splash Electron)
      (function() {
        try {
          var VALID = {
            classic: 1, 'vault-gate': 1, terminal: 1, 'premium-card': 1,
            'glass-hud': 1, synthwave: 1, aurora: 1, matrix: 1,
            ember: 1, nord: 1, midnight: 1
          };
          var LEGACY = {
            'hologram-hud': 'glass-hud',
            'synthwave-outrun': 'synthwave',
            'terminal-minimalist': 'terminal'
          };
          var id = 'classic';
          var m = /[?&]splash=([^&#]+)/.exec(location.search || '');
          if (!m && location.hash) {
            m = /^#splash=([^&]+)/.exec(location.hash) || /^#([^&]+)/.exec(location.hash);
          }
          if (m && m[1]) {
            id = decodeURIComponent(m[1]).toLowerCase().trim();
            if (LEGACY[id]) id = LEGACY[id];
            if (!VALID[id]) id = 'classic';
          }
          document.documentElement.setAttribute('data-boot-splash', id);
        } catch (e) {
          document.documentElement.setAttribute('data-boot-splash', 'classic');
        }
      })();
    </script>
    <script>
      // Aplicar fondo básico INMEDIATAMENTE para evitar flash blanco
      // NO establecer variables CSS del tema aquí - el ThemeManager se encargará de eso
      (function() {
        try {
          // Temas claros conocidos
          const lightThemes = ['Light', 'Solarized Light', 'Atom One Light', 'Paper', 'Silver', 'Soft Gray', 'Minimal Gray'];
          
          // Leer tema guardado del localStorage
          const savedTheme = localStorage.getItem('ui_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          // Determinar si es tema claro u oscuro solo para el fondo básico
          let isLight = false;
          if (savedTheme) {
            isLight = lightThemes.includes(savedTheme);
          } else {
            // Si no hay tema guardado, usar preferencia del sistema
            isLight = !prefersDark;
          }
          
          // Solo establecer el fondo básico - NO variables CSS del tema
          // El ThemeManager aplicará el tema completo después
          const basicBg = isLight ? '#ffffff' : '#0e1116';
          
          // Aplicar fondo inmediatamente al html (siempre existe)
          document.documentElement.style.backgroundColor = basicBg;
          
          // Aplicar fondo al body solo si ya existe (puede no existir si el script corre en <head>)
          if (document.body) {
            document.body.style.backgroundColor = basicBg;
          }
          
          // Si el body no existe aún, aplicar el fondo cuando esté disponible
          if (!document.body) {
            const observer = new MutationObserver((mutations, obs) => {
              if (document.body) {
                document.body.style.backgroundColor = basicBg;
                obs.disconnect();
              }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
          
          // Tipografía temprana para evitar saltos o flash de tamaño al arrancar
          const savedFontSize = localStorage.getItem('uiFontSize') || localStorage.getItem('sidebarFontSize') || localStorage.getItem('explorerFontSize');
          if (savedFontSize) {
            const numSize = parseFloat(savedFontSize);
            if (!isNaN(numSize) && numSize > 0) {
              document.documentElement.style.setProperty('--ui-font-size', numSize + 'px');
              document.documentElement.style.setProperty('--sidebar-font-size', numSize + 'px');
              document.documentElement.style.setProperty('--explorer-font-size', numSize + 'px');
              document.documentElement.style.setProperty('--home-tab-font-size', numSize + 'px');
              document.documentElement.style.setProperty('font-size', (numSize * (16 / 14)).toFixed(4) + 'px');
            }
          }
          const savedFont = localStorage.getItem('uiFont') || localStorage.getItem('sidebarFont') || localStorage.getItem('explorerFont');
          if (savedFont && savedFont.trim()) {
            const trimmedFont = savedFont.trim();
            const fontStack = trimmedFont.includes(',') ? trimmedFont : `"${trimmedFont}", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            document.documentElement.style.setProperty('--ui-font-family', fontStack);
            document.documentElement.style.setProperty('--font-family', fontStack);
            document.documentElement.style.setProperty('--sidebar-font-family', fontStack);
            document.documentElement.style.setProperty('--explorer-font-family', fontStack);
            document.documentElement.style.setProperty('--home-tab-font-family', fontStack);
          }

          // Marcar que el fondo básico está aplicado
          window.__earlyThemeApplied = true;
        } catch (e) {
          console.error('[EARLY THEME] Error aplicando fondo temprano:', e);
          // Fallback: aplicar fondo oscuro por defecto
          document.documentElement.style.backgroundColor = '#0e1116';
          if (document.body) {
            document.body.style.backgroundColor = '#0e1116';
          }
        }
      })();
    </script>
    <style>
      /* Estilos críticos de arranque: evitan flash blanco y permiten fade-in */
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #0e1116; /* fondo oscuro para evitar destello blanco */
        color: #cfd8dc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* El contenido React inicia oculto y aparece suavemente */
      #root { opacity: 0; transition: opacity 240ms ease; min-height: 100%; }
      html.app-ready #root { opacity: 1; }

      /* Splash de arranque: cubre todo hasta que la app esté lista */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 120% at 50% 10%, #1b2330 0%, #0e1116 60%, #0a0c10 100%);
        color: #e3f2fd;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", "Noto Sans", "Liberation Sans", sans-serif;
        letter-spacing: 0.2px;
        transition: opacity 300ms ease, visibility 0s linear 300ms;
      }
      #boot-splash.hidden { opacity: 0; visibility: hidden; }
      #boot-splash .brand { font-weight: 600; font-size: 18px; opacity: 0.95; }
      #boot-splash .spinner {
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.25);
        border-top-color: #79b8ff;
        animation: spin 720ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Variantes boot-splash (IDs unificados con unlock) */
      html[data-boot-splash='classic'] #boot-splash {
        background: linear-gradient(180deg, #1a2332 0%, #0f1722 50%, #0a0f18 100%);
        color: #e3f2fd;
      }
      html[data-boot-splash='classic'] #boot-splash .spinner { border-color: rgba(59,130,246,0.25); border-top-color: #3b82f6; }

      html[data-boot-splash='vault-gate'] #boot-splash {
        background: linear-gradient(180deg, #1a2332 0%, #0f1722 50%, #0a0f18 100%);
        color: #e3f2fd;
      }
      html[data-boot-splash='vault-gate'] #boot-splash .spinner { border-color: rgba(59,130,246,0.25); border-top-color: #3b82f6; }

      html[data-boot-splash='terminal'] #boot-splash {
        background: #000;
        color: #00ff66;
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      html[data-boot-splash='terminal'] #boot-splash .spinner { border-color: rgba(0,255,102,0.2); border-top-color: #00ff66; }

      html[data-boot-splash='premium-card'] #boot-splash {
        background: #080a0e;
        color: #e2e8f0;
      }
      html[data-boot-splash='premium-card'] #boot-splash .spinner { border-color: rgba(14,99,156,0.3); border-top-color: #0e639c; }

      html[data-boot-splash='glass-hud'] #boot-splash {
        background: #06040d;
        color: #00f2fe;
      }
      html[data-boot-splash='glass-hud'] #boot-splash .spinner { border-color: rgba(0,242,254,0.2); border-top-color: #00f2fe; }

      html[data-boot-splash='synthwave'] #boot-splash {
        background: #0f021a;
        color: #ff007f;
      }
      html[data-boot-splash='synthwave'] #boot-splash .spinner { border-color: rgba(255,0,127,0.2); border-top-color: #ff007f; }

      html[data-boot-splash='aurora'] #boot-splash {
        background: linear-gradient(160deg, #7dd3fc 0%, #818cf8 48%, #c4b5fd 100%);
        color: #1e1b4b;
      }
      html[data-boot-splash='aurora'] #boot-splash .spinner { border-color: rgba(99,102,241,0.25); border-top-color: #6366f1; }

      html[data-boot-splash='matrix'] #boot-splash {
        background: #020c06;
        color: #22c55e;
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      html[data-boot-splash='matrix'] #boot-splash .spinner { border-color: rgba(34,197,94,0.25); border-top-color: #22c55e; }

      html[data-boot-splash='ember'] #boot-splash {
        background: #120a06;
        color: #fb923c;
      }
      html[data-boot-splash='ember'] #boot-splash .spinner { border-color: rgba(249,115,22,0.3); border-top-color: #f97316; }

      html[data-boot-splash='nord'] #boot-splash {
        background: linear-gradient(180deg, #4c566a 0%, #2e3440 100%);
        color: #eceff4;
      }
      html[data-boot-splash='nord'] #boot-splash .spinner { border-color: rgba(136,192,208,0.3); border-top-color: #88c0d0; }

      html[data-boot-splash='midnight'] #boot-splash {
        background: #07070f;
        color: #a5b4fc;
      }
      html[data-boot-splash='midnight'] #boot-splash .spinner { border-color: rgba(129,140,248,0.3); border-top-color: #818cf8; }
    </style>
  </head>
  <body>
    <div id="boot-splash"><div class="spinner"></div><div class="brand">NodeTerm</div></div>
    <div id="root"></div>
  </body>
</html>
